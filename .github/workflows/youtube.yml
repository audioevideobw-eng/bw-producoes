name: Vídeos do YouTube no portfólio

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas
  workflow_dispatch: {}       # botão "Run workflow" para atualizar na hora
  push:
    paths:
      - scripts/youtube_feed.py
      - .github/workflows/youtube.yml

permissions:
  contents: write

concurrency:
  group: youtube-feed
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler o canal
        run: python scripts/youtube_feed.py @bwproducoes2626
      - name: Publicar se mudou
        run: |
          if [ -n "$(git status --porcelain data/youtube.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/youtube.json
            git commit -m "Portfólio: vídeos do YouTube atualizados"
            git push
          else
            echo "Nada novo."
          fi
